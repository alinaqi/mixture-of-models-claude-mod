name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pure-function tests
        run: npm test
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and hooks module
        run: claude plugin validate --strict .
      - name: Hook tests (skipped until the published Claude Code has `plugin test`)
        run: |
          if claude plugin --help 2>/dev/null | grep -qE '^\s+test\b'; then
            claude plugin test
          else
            echo "::notice::claude $(claude --version | awk '{print $1}') has no 'plugin test'; hook tests skipped"
          fi
